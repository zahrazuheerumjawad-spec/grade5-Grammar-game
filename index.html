<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sentence Combining Game</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family: Arial, sans-serif;
  background: linear-gradient(135deg,#fff3b0,#d9f7ff,#f5d6ff);
  min-height:100vh;
  text-align:center;
  color:#222;
}

.container{
  max-width:900px;
  margin:20px auto;
  background:white;
  padding:25px;
  border-radius:28px;
  box-shadow:0 10px 25px rgba(0,0,0,0.18);
}

h1{
  color:#24135f;
  font-size:42px;
  margin-bottom:5px;
}

.subtitle{
  font-size:22px;
  color:#7b2cbf;
  font-weight:bold;
}

.badge{
  display:inline-block;
  background:#ffca3a;
  padding:10px 18px;
  border-radius:30px;
  margin:12px;
  font-weight:bold;
}

input{
  padding:14px;
  font-size:18px;
  border:2px solid #7b2cbf;
  border-radius:15px;
  width:80%;
  max-width:350px;
  text-align:center;
}

button{
  border:none;
  border-radius:18px;
  padding:14px 22px;
  margin:10px;
  font-size:18px;
  font-weight:bold;
  cursor:pointer;
  background:#4361ee;
  color:white;
  transition:0.2s;
}

button:hover{
  transform:scale(1.05);
  background:#3a0ca3;
}

.option{
  display:block;
  width:90%;
  margin:12px auto;
  background:#f1f8ff;
  color:#222;
  border:2px solid #90caf9;
  text-align:left;
}

.option:hover{
  background:#d7efff;
}

.correct{
  background:#b7f7c1 !important;
  border-color:#2fb344 !important;
}

.wrong{
  background:#ffc7c7 !important;
  border-color:#e63946 !important;
}

.hidden{
  display:none;
}

.score-box{
  font-size:22px;
  font-weight:bold;
  color:#006400;
}

.question{
  font-size:26px;
  font-weight:bold;
  margin:25px 0;
}

.feedback{
  font-size:24px;
  font-weight:bold;
  margin:15px;
}

.progress{
  font-size:18px;
  color:#555;
  font-weight:bold;
}

.final{
  font-size:28px;
  color:#3a0ca3;
  font-weight:bold;
}

.footer{
  margin-top:20px;
  color:#777;
}
</style>
</head>

<body>

<div class="container" id="startScreen">
  <h1>Sentence Combining Game</h1>
  <div class="subtitle">Hi Grade 5A! Let’s revise grammar!</div>
  <div class="badge">Adjectives • Adverbs • Prepositional Phrases • Compound Sentences</div>
  <br>
  <input type="text" id="studentName" placeholder="Enter your name">
  <br>
  <button onclick="startGame()">Start Game</button>
</div>

<div class="container hidden" id="gameScreen">
  <div class="progress" id="progress"></div>
  <div class="score-box" id="scoreBox"></div>
  <div class="question" id="question"></div>
  <div id="options"></div>
  <div class="feedback" id="feedback"></div>
  <button id="nextBtn" class="hidden" onclick="nextQuestion()">Next Question</button>
</div>

<div class="container hidden" id="endScreen">
  <h1>Great Job!</h1>
  <div class="final" id="finalMessage"></div>
  <button onclick="restartGame()">Play Again</button>
</div>

<script>
let questions = [
  {
    question: "What is sentence combining?",
    options: [
      "Making sentences shorter only",
      "Joining two or more simple sentences into one sentence",
      "Writing only questions",
      "Adding punctuation"
    ],
    answer: 1
  },
  {
    question: "What does an adjective do?",
    options: [
      "Describes a noun",
      "Describes an action",
      "Shows time",
      "Connects sentences"
    ],
    answer: 0
  },
  {
    question: "Which word is an adjective?",
    options: ["Quickly", "Old", "Before", "And"],
    answer: 1
  },
  {
    question: "Which sentence uses an adjective correctly?",
    options: [
      "I opened the old door.",
      "I quickly door.",
      "The door slowly opened.",
      "I opened in the door."
    ],
    answer: 0
  },
  {
    question: "What does an adverb describe?",
    options: [
      "A noun",
      "A place",
      "An action or verb",
      "A person"
    ],
    answer: 2
  },
  {
    question: "Which word is an adverb?",
    options: ["Beautiful", "Door", "Frequently", "Park"],
    answer: 2
  },
  {
    question: "Choose the best combined sentence: The girls practiced their duet. They practiced frequently.",
    options: [
      "The girls duet frequently.",
      "The girls frequently practiced their duet.",
      "Frequently girls practiced.",
      "The girls practiced."
    ],
    answer: 1
  },
  {
    question: "What does a prepositional phrase tell?",
    options: [
      "A color",
      "Time or place",
      "A feeling",
      "A number"
    ],
    answer: 1
  },
  {
    question: "Which phrase is a prepositional phrase?",
    options: [
      "Quickly ran",
      "Old house",
      "In the park",
      "Funny joke"
    ],
    answer: 2
  },
  {
    question: "Choose the best combined sentence: They looked forward to the performance. The performance was in two weeks.",
    options: [
      "They looked performance.",
      "They looked forward to the performance in two weeks.",
      "In two weeks looked forward.",
      "Performance looked forward."
    ],
    answer: 1
  },
  {
    question: "Which conjunction can combine sentences?",
    options: ["Quickly", "Old", "And", "Blue"],
    answer: 2
  },
  {
    question: "Choose the correct compound sentence: Our school had an art contest. I decided to enter.",
    options: [
      "Our school had an art contest, and I decided to enter.",
      "Our school art contest enter.",
      "I enter contest.",
      "Our school contest quickly."
    ],
    answer: 0
  },
  {
    question: "Which conjunction shows a difference?",
    options: ["And", "But", "Or", "In"],
    answer: 1
  },
  {
    question: "Choose the best sentence: My first painting wasn’t very good. I did better with the next one.",
    options: [
      "My first painting wasn’t very good, but I did much better with the next one.",
      "My painting next one.",
      "Better painting good.",
      "My first painting and."
    ],
    answer: 0
  },
  {
    question: "What is a compound predicate?",
    options: [
      "Two actions done by one subject",
      "Two people talking",
      "A question sentence",
      "A describing word"
    ],
    answer: 0
  },
  {
    question: "Which sentence has a compound predicate?",
    options: [
      "She ran quickly.",
      "The dog barked loudly.",
      "Meerkats hunt early and live in mobs.",
      "The old dog slept."
    ],
    answer: 2
  },
  {
    question: "Which sentence combines ideas correctly?",
    options: [
      "She studied hard and passed the test.",
      "She hard passed.",
      "Studied test hard.",
      "She the test."
    ],
    answer: 0
  },
  {
    question: "Which word is a conjunction?",
    options: ["Carefully", "Before", "But", "Happy"],
    answer: 2
  },
  {
    question: "Which sentence uses an adverb?",
    options: [
      "The happy dog barked.",
      "The dog barked loudly.",
      "The dog in the yard.",
      "The dog and cat."
    ],
    answer: 1
  },
  {
    question: "Why do writers combine sentences?",
    options: [
      "To make writing smoother and more interesting",
      "To make writing confusing",
      "To write fewer ideas",
      "To remove details"
    ],
    answer: 0
  }
];

let currentQuestion = 0;
let score = 0;
let student = "";

function startGame(){
  student = document.getElementById("studentName").value.trim();

  if(student === ""){
    alert("Please enter your name first!");
    return;
  }

  document.getElementById("startScreen").classList.add("hidden");
  document.getElementById("gameScreen").classList.remove("hidden");

  currentQuestion = 0;
  score = 0;
  showQuestion();
}

function showQuestion(){
  document.getElementById("feedback").innerHTML = "";
  document.getElementById("nextBtn").classList.add("hidden");

  let q = questions[currentQuestion];

  document.getElementById("progress").innerHTML =
    "Question " + (currentQuestion + 1) + " of " + questions.length;

  document.getElementById("scoreBox").innerHTML =
    "Score: " + score;

  document.getElementById("question").innerHTML = q.question;

  let optionsDiv = document.getElementById("options");
  optionsDiv.innerHTML = "";

  q.options.forEach((option, index) => {
    let btn = document.createElement("button");
    btn.className = "option";
    btn.innerHTML = String.fromCharCode(65 + index) + ") " + option;
    btn.onclick = function(){
      checkAnswer(index, btn);
    };
    optionsDiv.appendChild(btn);
  });
}

function checkAnswer(selected, button){
  let q = questions[currentQuestion];
  let optionButtons = document.querySelectorAll(".option");

  optionButtons.forEach(btn => {
    btn.disabled = true;
  });

  if(selected === q.answer){
    button.classList.add("correct");
    document.getElementById("feedback").innerHTML = "Correct! 🌟";
    score++;
  } else {
    button.classList.add("wrong");
    optionButtons[q.answer].classList.add("correct");
    document.getElementById("feedback").innerHTML = "Try to remember the rule! ✅";
  }

  document.getElementById("scoreBox").innerHTML =
    "Score: " + score;

  document.getElementById("nextBtn").classList.remove("hidden");
}

function nextQuestion(){
  currentQuestion++;

  if(currentQuestion < questions.length){
    showQuestion();
  } else {
    endGame();
  }
}

function endGame(){
  document.getElementById("gameScreen").classList.add("hidden");
  document.getElementById("endScreen").classList.remove("hidden");

  let percent = Math.round((score / questions.length) * 100);
  let message = "";

  if(percent >= 90){
    message = "Excellent work, " + student + "! 🌟";
  } else if(percent >= 70){
    message = "Great job, " + student + "! 👍";
  } else {
    message = "Good try, " + student + "! Keep practicing 💪";
  }

  document.getElementById("finalMessage").innerHTML =
    message + "<br><br>Your score: " + score + " / " + questions.length +
    "<br>Percentage: " + percent + "%";
}

function restartGame(){
  document.getElementById("endScreen").classList.add("hidden");
  document.getElementById("startScreen").classList.remove("hidden");
  document.getElementById("studentName").value = "";
}
</script>

</body>
</html>
